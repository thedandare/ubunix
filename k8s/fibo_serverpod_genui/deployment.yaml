---
# 1. CONFIGURAÇÕES DO APLICATIVO (VARIÁVEIS DE AMBIENTE)
apiVersion: v1
kind: ConfigMap
metadata:
  name: meu-app-config
data:
  APP_ENV: "production"
  API_URL: "http://exemplo.com"

---
# 2. DADOS SENSÍVEIS (SENHAS/TOKENS CODIFICADOS EM BASE64)
apiVersion: v1
kind: Secret
metadata:
  name: meu-app-secret
type: Opaque
data:
  # Exemplo: "minhasenha123" em base64 é "bWluaGFzZW5oYTEyMw=="
  DB_PASSWORD: bWluaGFzZW5oYTEyMw==

---
# 3. O DEPLOYMENT (GERENCIAMENTO DOS CONTAINERS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-app-deployment
  labels:
    app: meu-app
spec:
  replicas: 2 # Roda 2 instâncias para alta disponibilidade
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Sobe 1 pod novo antes de derrubar o antigo
      maxUnavailable: 0 # Garante zero downtime no update
  selector:
    matchLabels:
      app: meu-app
  template:
    metadata:
      labels:
        app: meu-app
    spec:
      containers:
      - name: meu-app-container
        image: meu-app:local
        imagePullPolicy: Never # Obriga o MicroK8s a usar a imagem local do script

        # Portas expostas dentro do container
        ports:
        - containerPort: 80
          name: http

        # Limites para o container não consumir toda a RAM/CPU da sua máquina
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        # Injeta as variáveis de ambiente criadas no ConfigMap e Secret acima
        envFrom:
        - configMapRef:
            name: meu-app-config
        - secretRef:
            name: meu-app-secret

        # Teste de Inicialização (Aguarda o app iniciar)
        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 30
          periodSeconds: 10

        # Teste de Saúde (Reinicia o container se o app travar)
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

        # Teste de Prontidão (Corta o tráfego se o app ficar sobrecarregado)
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---
# 4. O SERVIÇO (EXPOSIÇÃO PARA FORA DO MICROK8S)
apiVersion: v1
kind: Service
metadata:
  name: meu-app-service
spec:
  type: NodePort
  selector:
    app: meu-app
  ports:
  - protocol: TCP
    port: 80         # Porta do Serviço
    targetPort: 80   # Porta interna do seu Container
    nodePort: 32080  # Porta que você vai digitar no navegador (ex: http://localhost:32080)
