apiVersion: v1
kind: Namespace
metadata:
  name: letta
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: letta-state
  namespace: letta
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: letta-app-server
  namespace: letta
  labels:
    app: letta-app-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: letta-app-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: letta-app-server
    spec:
      containers:
        - name: letta-app-server
          image: thedandare/fibo-letta-server:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4500
          env:
            - name: PORT
              value: "4500"
            - name: LETTA_BACKEND
              value: "local"
            - name: LETTA_OPENAI_API
              value: "false"
            - name: LETTA_APP_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: letta-app-server
                  key: token
          volumeMounts:
            - name: letta-state
              mountPath: /root/.letta
            - name: letta-workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: letta-state
          persistentVolumeClaim:
            claimName: letta-state
        - name: letta-workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: letta-app-server
  namespace: letta
spec:
  type: NodePort
  selector:
    app: letta-app-server
  ports:
    - name: http
      protocol: TCP
      port: 4500
      targetPort: http
      nodePort: 32500
