# Raw TCP route to the CloudNativePG primary through Traefik.
#
# CloudNativePG owns the postgres-server-rw / -ro / -r ClusterIP services, so
# nothing here mutates them: Traefik proxies the 'postgres' entrypoint (5432 on
# the LoadBalancer IPs) to the -rw service, which always points at the primary.
#
# HostSNI(`*`) is required for non-TLS TCP routers: the PostgreSQL wire protocol
# starts in plaintext, so there is no SNI to match on.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgres-tcp
  namespace: default
spec:
  entryPoints:
    - postgres
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postgres-server-rw
          port: 5432
