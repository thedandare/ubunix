# Raw TCP route to the Headlamp service through Traefik.
#
# Headlamp serves HTTP, but the TCP router keeps the route independent of
# Host-based HTTP configuration and matches the existing node-port workflow.
apiVersion: traefik.io/v1alpha3
kind: IngressRouteTCP
metadata:
  name: headlamp-tcp
  namespace: kube-system
spec:
  entryPoints:
    - headlamp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: my-headlamp
          port: 80
