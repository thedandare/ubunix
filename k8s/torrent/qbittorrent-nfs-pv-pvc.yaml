apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-downloads-nfs
spec:
  capacity:
    # Para NFS estático este valor é usado para binding; não limita
    # fisicamente o filesystem remoto.
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
  nfs:
    server: 192.168.0.10
    path: /st40-ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: qbittorrent-downloads-nfs
  resources:
    requests:
      storage: 1Gi
