# HTTPS route on the always-open 443 entrypoint (the cloud firewall only
# allows 443 from the outside): https://portainer.34.0.220.87.nip.io
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer-web
  namespace: portainer
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - kind: Rule
      match: Host(`pt.gce.6nix.pl `)
      services:
        - name: portainer
          port: http
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: portainer-tcp
  namespace: portainer
spec:
  entryPoints:
    - portainer
  routes:
    - match: HostSNI(`*`)
      services:
        - name: portainer
          port: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: portainer-edge-tcp
  namespace: portainer
spec:
  entryPoints:
    - portainer-edge
  routes:
    - match: HostSNI(`*`)
      services:
        - name: portainer
          port: edge
