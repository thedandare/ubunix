apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-mcp
  namespace: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j-mcp
  template:
    metadata:
      labels:
        app: neo4j-mcp
    spec:
      containers:
        - name: neo4j-mcp
          image: neo4j/mcp:latest
          env:
            - name: NEO4J_URI
              value: "bolt://my-neo4j-release:7687"
            - name: NEO4J_TRANSPORT_MODE
              value: "http"
            - name: NEO4J_MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: NEO4J_MCP_HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-mcp
  namespace: neo4j
spec:
  type: LoadBalancer
  selector:
    app: neo4j-mcp
  ports:
    - port: 8080
      targetPort: 8080
