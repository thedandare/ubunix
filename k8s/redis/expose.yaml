# Raw TCP routes to the Redis chart services through Traefik.
#
# HostSNI(`*`) is required for non-TLS TCP routers: the Redis protocol starts in
# plaintext, so there is no SNI to match on.
#
# The 'redis' Service selects every node of the sentinel group, so a connection
# on 18494 may land on a replica (writes then fail with -READONLY). Sentinel-
# aware clients should use 26379 — note that Sentinel answers with in-cluster
# pod IPs (10.1.x.x), which only helps clients running inside the cluster/VPN.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis-tcp
  namespace: redis
spec:
  entryPoints:
    - redis
  routes:
    - match: HostSNI(`*`)
      services:
        - name: redis
          port: 18494
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis-sentinel-tcp
  namespace: redis
spec:
  entryPoints:
    - redis-sentinel
  routes:
    - match: HostSNI(`*`)
      services:
        - name: redis
          port: 26379
